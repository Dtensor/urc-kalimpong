name: Kalimpong browser acceptance
on:
  push:
    branches: ["kalimpong-visual-20261114", "main"]
    paths: ["mall/**", "complex/**", ".github/workflows/kalimpong-visual.yml", ".github/scripts/visual-smoke.cjs"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/kalimpong-check" --no-package-lock --no-audit --no-fund playwright@1.59.1
          "$RUNNER_TEMP/kalimpong-check/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check all six venues on desktop and phone
        env:
          NODE_PATH: ${{ runner.temp }}/kalimpong-check/node_modules
          KALIMPONG_CASES: ${{ github.ref_name == 'kalimpong-visual-20261114' && 'urc:desktop,urc:phone,plaza:desktop,plaza:phone,grocery:desktop,grocery:phone,sabzi:desktop,sabzi:phone' || '' }}
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/kalimpong-http.log" 2>&1 &
          node .github/scripts/visual-smoke.cjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: kalimpong-browser-evidence
          path: browser-evidence/
          retention-days: 7
  review-captures:
    needs: browser
    if: always() && github.ref_name == 'kalimpong-visual-20261114'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          name: kalimpong-browser-evidence
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: browser-evidence
      - name: Save public-page captures on isolated evidence branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add browser-evidence
          git commit -m 'Archive public Kalimpong browser acceptance captures'
          git push origin "HEAD:refs/heads/kalimpong-evidence-${{ github.run_id }}-${{ github.run_attempt }}"
