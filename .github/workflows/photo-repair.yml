name: URC reviewed photo corrections
on:
  push:
    branches: [kalimpong-photo-repair-20261115]
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==12.2.0
      - name: Acquire only reviewed photos with exact source hashes
        run: python .github/scripts/build-repairs.py .
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify correction guards and unchanged catalogue
        run: node .github/scripts/verify-repairs.cjs mall/index.html .
      - run: |
          npm install --prefix "$RUNNER_TEMP/check" --no-package-lock --no-audit --no-fund playwright@1.59.1
          "$RUNNER_TEMP/check/node_modules/.bin/playwright" install --with-deps ${{ matrix.engine }}
      - name: Check desktop and phone search, photos and detail views
        env:
          NODE_PATH: ${{ runner.temp }}/check/node_modules
          ENGINE: ${{ matrix.engine }}
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/http.log" 2>&1 &
          node .github/scripts/repair-browser.cjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: repair-${{ matrix.engine }}
          path: repair-evidence/${{ matrix.engine }}-*
          retention-days: 7
      - uses: actions/upload-artifact@v5
        if: always() && matrix.engine == 'chromium'
        with:
          name: corrected-assets
          path: complex/shared/urc-products
          retention-days: 7
  captures:
    needs: browser
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          name: corrected-assets
          path: complex/shared/urc-products
      - uses: actions/download-artifact@v5
        with:
          pattern: repair-*
          merge-multiple: true
          path: repair-evidence
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add complex/shared/urc-products repair-evidence
          git commit -m 'Retain reviewed product photos and browser evidence'
          git push origin "HEAD:refs/heads/photo-repair-evidence-${{ github.run_id }}-${{ github.run_attempt }}"
