name: URC Easy shopping acceptance
on:
  push:
    branches: [kalimpong-easy-mobile-20261115, main]
    paths: ['mall/index.html', 'complex/shared/easy*', '.github/scripts/easy-*', '.github/workflows/easy-shopping.yml']
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node .github/scripts/easy-core-test.cjs .
      - run: |
          npm install --prefix "$RUNNER_TEMP/check" --no-package-lock --no-audit --no-fund playwright@1.59.1 axe-core@4.10.3
          "$RUNNER_TEMP/check/node_modules/.bin/playwright" install --with-deps ${{ matrix.engine }}
      - name: Verify accessible shopping and retained hall
        env:
          NODE_PATH: ${{ runner.temp }}/check/node_modules
          ENGINE: ${{ matrix.engine }}
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/http.log" 2>&1 &
          node .github/scripts/easy-browser.cjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: easy-${{ matrix.engine }}
          path: easy-evidence/${{ matrix.engine }}-*
          retention-days: 7
  captures:
    needs: browser
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          pattern: easy-*
          merge-multiple: true
          path: easy-evidence
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add easy-evidence
          git commit -m 'Retain Easy shopping browser and accessibility evidence'
          git push origin "HEAD:refs/heads/easy-evidence-${{ github.run_id }}-${{ github.run_attempt }}"
