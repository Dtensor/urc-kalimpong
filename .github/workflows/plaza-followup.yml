name: Verify plaza desktop independently
on:
  push:
    branches: [kalimpong-plaza-followup-20261115]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: |
          npm install --prefix "$RUNNER_TEMP/check" --no-package-lock --no-audit --no-fund playwright@1.59.1
          "$RUNNER_TEMP/check/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify plaza desktop in a fresh browser
        env:
          NODE_PATH: ${{ runner.temp }}/check/node_modules
          KALIMPONG_CASES: plaza:desktop
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/http.log" 2>&1 &
          node .github/scripts/visual-smoke.cjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: plaza-followup
          path: browser-evidence
          retention-days: 7
  captures:
    needs: browser
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          name: plaza-followup
          path: browser-evidence
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add browser-evidence
          git commit -m 'Retain isolated plaza desktop check'
          git push origin "HEAD:refs/heads/plaza-followup-evidence-${{ github.run_id }}-${{ github.run_attempt }}"
