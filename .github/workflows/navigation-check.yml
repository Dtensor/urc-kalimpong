name: Comfortable shelf navigation acceptance
on:
  push:
    branches: ["kalimpong-navigation-20261115"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install pinned browser runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/check" --no-package-lock --no-audit --no-fund playwright@1.59.1
          "$RUNNER_TEMP/check/node_modules/.bin/playwright" install --with-deps ${{ matrix.engine }}
      - name: Verify shelf framing and warp controls
        env:
          NODE_PATH: ${{ runner.temp }}/check/node_modules
          ENGINE: ${{ matrix.engine }}
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/http.log" 2>&1 &
          node .github/scripts/navigation-check.cjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: navigation-${{ matrix.engine }}
          path: navigation-evidence/${{ matrix.engine }}-*
          retention-days: 7
  captures:
    needs: [browser]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          pattern: navigation-*
          merge-multiple: true
          path: navigation-evidence
      - name: Retain navigation browser evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add navigation-evidence
          git commit -m 'Retain navigation review evidence'
          git push origin "HEAD:refs/heads/navigation-evidence-${{ github.run_id }}-${{ github.run_attempt }}"
