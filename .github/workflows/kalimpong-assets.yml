name: Acquire plaza CC0 materials
on:
  push:
    branches: ["kalimpong-assets-20261114"]
    paths: [".github/workflows/kalimpong-assets.yml"]
permissions:
  contents: write
jobs:
  materials:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Download six bounded material maps
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, json, hashlib
          from pathlib import Path
          dest = Path("complex/shared/materials/scanned")
          dest.mkdir(parents=True, exist_ok=True)
          records = []
          def fetch(url, limit):
              if urllib.parse.urlparse(url).hostname not in ("api.polyhaven.com", "dl.polyhaven.org", "dl.polyhaven.com"):
                  raise ValueError("Unexpected material host")
              req = urllib.request.Request(url, headers={"User-Agent": "KalimpongShowcase/1.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = r.read(limit + 1)
              if len(data) > limit:
                  raise ValueError("Material exceeds budget")
              return data
          for asset, prefix in [("cobblestone_floor_02","stone"), ("plastered_wall_02","plaster")]:
              maps = json.loads(fetch("https://api.polyhaven.com/files/" + asset, 2000000))
              for channel in ("diff", "nor_gl", "rough"):
                  item = maps[channel]["1k"]["jpg"]
                  data = fetch(item["url"], 2000000)
                  if not data.startswith(b"\xff\xd8"):
                      raise ValueError("Expected JPEG")
                  target = dest / (prefix + "-" + channel + ".jpg")
                  target.write_bytes(data)
                  records.append({"path":str(target),"asset":asset,"channel":channel,"resolution":"1k","bytes":len(data),"sha256":hashlib.sha256(data).hexdigest(),"source":item["url"],"license":"CC0-1.0","assetPage":"https://polyhaven.com/a/"+asset})
          (dest / "provenance.json").write_text(json.dumps({"licenseSource":"https://polyhaven.com/license","assets":records}, indent=2))
          print("Acquired", len(records), "maps;", sum(x["bytes"] for x in records), "bytes")
          PY
      - name: Save acquired public assets on separate branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add complex/shared/materials/scanned
          git commit -m 'Acquire six CC0 Poly Haven plaza material maps with provenance'
          git push origin "HEAD:refs/heads/kalimpong-materials-${{ github.run_id }}"
